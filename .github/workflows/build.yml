name: Build and Push Container

# Two image variants are built on every push to main / on schedule:
#
#   variant=bake     (Dockerfile)
#     - Canonical legacy build with scanner DBs baked into the image at build time.
#     - Pushed to GHCR + registry.fly.io/{staging-harborguard-scans,prod-harborguard-sensor}.
#     - Continues to back HG_SENSOR_IMAGE in workers (default-off NFS path).
#     - Required so a Phase 5 rollback (HG_USE_NFS_DB=0) keeps scanning with
#       fresh DBs instead of a frozen :bake-pre-juicefs snapshot that decays.
#
#   variant=juicefs  (Dockerfile.juicefs-mountclient)
#     - JuiceFS mount-client variant: no DB bake, mounts a shared JuiceFS
#       volume at runtime. Validated as Phase 3 staging-cutover image.
#     - Pushed to GHCR + registry.fly.io/{staging-harborguard-scans,prod-harborguard-scans}
#       under :nfs-* tag scheme so it cannot collide with the bake :latest.
#     - Backs HG_SENSOR_IMAGE_NFS in workers; resolver in src/lib/sensor.ts
#       prefers it when HG_USE_NFS_DB=1.
#
# Notes on tag scheme (intentional, do not "simplify"):
#   bake variant:    :<branch>, :<sha8>, :latest (on main), :<semver> on tag
#   juicefs variant: :nfs-<branch>, :nfs-<sha8>, :nfs-prod (on main, only to
#                    prod-harborguard-scans), :nfs-staging (on main, only to
#                    staging-harborguard-scans). NEVER :latest — that's the
#                    bake variant's namespace and Phase 5 reserves :latest as
#                    the rollback path.
#   :bake-pre-juicefs is a manually-pinned rollback tag created by deploy-sme
#                    in Phase 5 prep. CI MUST NOT touch it.

on:
  schedule:
    - cron: '00 00 * * *'
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  # Manual trigger lets us run the workflow from feature branches without
  # polluting the registry with per-feature-branch :latest / :nfs-prod tags
  # (those are gated by is_default_branch). The toggles let a dispatch
  # rebuild only one variant — useful when iterating on Dockerfile.juicefs
  # without rebuilding the bake DBs (~3 min savings).
  workflow_dispatch:
    inputs:
      build_juicefs:
        description: 'Build JuiceFS variant (default true)'
        type: boolean
        default: true
      build_bake:
        description: 'Build bake variant (default true)'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Per-arch builds, one job instance per (variant, platform) cell.
  # 4 cells in steady state: {bake,juicefs} x {amd64,arm64}.
  # Each variant pushes its per-arch digest to GHCR; the merge job below
  # then assembles the multi-arch index per variant and mirrors to Fly.
  build:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: bake
            dockerfile: Dockerfile
            tag_prefix: ''
          - name: juicefs
            dockerfile: Dockerfile.juicefs-mountclient
            tag_prefix: 'nfs-'
        platform:
          - id: linux/amd64
            short: amd64
            runner: ubuntu-latest
          - id: linux/arm64
            short: arm64
            runner: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Skip variant if disabled via workflow_dispatch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ matrix.variant.name }}" = "bake" ] && [ "${{ inputs.build_bake }}" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping bake variant (workflow_dispatch input build_bake=false)"
              exit 0
            fi
            if [ "${{ matrix.variant.name }}" = "juicefs" ] && [ "${{ inputs.build_juicefs }}" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "::notice::Skipping juicefs variant (workflow_dispatch input build_juicefs=false)"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        if: steps.gate.outputs.skip == 'false'
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.skip == 'false' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        if: steps.gate.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}

      # Each variant builds with a distinct cache scope so a bake DB refresh
      # doesn't bust the juicefs layer's cache and vice versa.
      - name: Build and push by digest
        if: steps.gate.outputs.skip == 'false'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant.name }}-${{ matrix.platform.short }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.name }}-${{ matrix.platform.short }}
          platforms: ${{ matrix.platform.id }}
          outputs: ${{ github.event_name != 'pull_request' && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', env.REGISTRY, env.IMAGE_NAME_LC) || '' }}

      - name: Export digest
        if: steps.gate.outputs.skip == 'false' && github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: steps.gate.outputs.skip == 'false' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.variant.name }}-${{ matrix.platform.short }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Per-variant merge + mirror. Two job instances in steady state.
  # - bake variant goes to: GHCR + staging-harborguard-scans + prod-harborguard-sensor
  # - juicefs variant goes to: GHCR + staging-harborguard-scans + prod-harborguard-scans
  #
  # The two variants share staging-harborguard-scans (different tag prefixes
  # keep them disjoint), but use *different* prod registry apps because the
  # prod rollback design separates the bake lineage (prod-harborguard-sensor)
  # from the new JuiceFS lineage (prod-harborguard-scans).
  merge:
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    needs: build
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: bake
            tag_prefix: ''
            prod_image: registry.fly.io/prod-harborguard-sensor
          - name: juicefs
            tag_prefix: 'nfs-'
            prod_image: registry.fly.io/prod-harborguard-scans

    steps:
      - name: Skip variant if disabled via workflow_dispatch
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ matrix.variant.name }}" = "bake" ] && [ "${{ inputs.build_bake }}" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "${{ matrix.variant.name }}" = "juicefs" ] && [ "${{ inputs.build_juicefs }}" != "true" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Lowercase image name
        if: steps.gate.outputs.skip == 'false'
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> $GITHUB_ENV

      - name: Download digests for this variant
        if: steps.gate.outputs.skip == 'false'
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.variant.name }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        if: steps.gate.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.gate.outputs.skip == 'false'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag scheme (per variant):
      #   bake:    :<branch>, :<sha8>, :<semver>, :latest (default branch)
      #   juicefs: :nfs-<branch>, :nfs-<sha8>, :nfs-<semver>, :nfs-staging
      #            and :nfs-prod (default branch only).
      # Crucially, juicefs DOES NOT push :latest. The bake variant owns :latest
      # so a worker reading HG_SENSOR_IMAGE=:latest gets the rollback path.
      # Phase 5 cutover flips workers to HG_SENSOR_IMAGE_NFS, which references
      # the :nfs-prod tag (separate registry app).
      #
      # IMPORTANT: flavor.latest=auto (NOT =true) for the bake variant. With
      # `=true`, metadata-action force-emits :latest on every ref including
      # feature branches — which would silently move prod-harborguard-sensor:latest
      # to a feature-branch build. `=auto` only emits :latest on the default
      # branch (per docker/metadata-action README, behavior table).
      - name: Extract metadata for GHCR
        if: steps.gate.outputs.skip == 'false'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          flavor: |
            prefix=${{ matrix.variant.tag_prefix }},onlatest=false
            latest=${{ matrix.variant.name == 'bake' && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.variant.tag_prefix }}

      - name: Create GHCR manifest list and push
        if: steps.gate.outputs.skip == 'false'
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: Inspect GHCR image
        if: steps.gate.outputs.skip == 'false'
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}:${{ steps.meta.outputs.version }}

      # Mirror to the staging Fly org (org `harborguard-882`,
      # registry.fly.io/staging-harborguard-scans). Both variants land here
      # but with disjoint tag prefixes (bake uses :main / :latest, juicefs
      # uses :nfs-main / :nfs-staging). Token is org-scoped — needs
      # FLY_REGISTRY_TOKEN_STAGING secret.
      - name: Check for staging Fly token
        if: steps.gate.outputs.skip == 'false'
        id: staging-token-check
        env:
          FLY_REGISTRY_TOKEN_STAGING: ${{ secrets.FLY_REGISTRY_TOKEN_STAGING }}
        run: |
          if [ -n "$FLY_REGISTRY_TOKEN_STAGING" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_REGISTRY_TOKEN_STAGING not set, skipping staging-harborguard-scans mirror for ${{ matrix.variant.name }}"
          fi

      - name: Log in to Fly registry (staging org)
        if: steps.gate.outputs.skip == 'false' && steps.staging-token-check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_REGISTRY_TOKEN_STAGING }}

      # For juicefs variant, the rolling tag on default branch is :nfs-staging
      # (matches the manual tag deploy-sme created in Phase 3 and what staging
      # workers consume via HG_SENSOR_IMAGE_NFS). For bake variant, the
      # default-branch rolling tag is :latest (via flavor.latest=true) and the
      # raw `:staging` rule is disabled (would otherwise emit `:staging`,
      # which workers don't consume and would just clutter the registry).
      - name: Extract metadata for Fly staging image
        if: steps.gate.outputs.skip == 'false' && steps.staging-token-check.outputs.present == 'true'
        id: fly-staging-meta
        uses: docker/metadata-action@v5
        with:
          images: registry.fly.io/staging-harborguard-scans
          flavor: |
            prefix=${{ matrix.variant.tag_prefix }},onlatest=false
            latest=${{ matrix.variant.name == 'bake' && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.variant.tag_prefix }}
            type=raw,value=staging,prefix=${{ matrix.variant.tag_prefix }},enable=${{ matrix.variant.name == 'juicefs' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Push manifest list to Fly registry (staging)
        if: steps.gate.outputs.skip == 'false' && steps.staging-token-check.outputs.present == 'true'
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.fly-staging-meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: Inspect Fly staging image
        if: steps.gate.outputs.skip == 'false' && steps.staging-token-check.outputs.present == 'true'
        run: |
          docker buildx imagetools inspect registry.fly.io/staging-harborguard-scans:${{ steps.fly-staging-meta.outputs.version }}

      # Mirror to the prod-harborguard Fly org. Each variant uses its OWN
      # prod registry app:
      #   bake    -> registry.fly.io/prod-harborguard-sensor
      #   juicefs -> registry.fly.io/prod-harborguard-scans
      #
      # CRITICAL: this workflow MUST NOT touch :bake-pre-juicefs. That tag is
      # a manually-pinned digest snapshot deploy-sme created from a specific
      # known-good prod image (sha256:dd9fcefc07fb…) for emergency rollback.
      # Re-tagging it from CI on every push would defeat the purpose of a
      # frozen rollback target. Filter explicitly excludes that tag and any
      # nfs-prod- per-sha if a maintainer ever creates one.
      - name: Check for prod Fly token
        if: steps.gate.outputs.skip == 'false'
        id: prod-token-check
        env:
          FLY_REGISTRY_TOKEN_PROD: ${{ secrets.FLY_REGISTRY_TOKEN_PROD }}
        run: |
          if [ -n "$FLY_REGISTRY_TOKEN_PROD" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::FLY_REGISTRY_TOKEN_PROD not set, skipping prod mirror for ${{ matrix.variant.name }}"
          fi

      - name: Log in to Fly registry (prod org)
        if: steps.gate.outputs.skip == 'false' && steps.prod-token-check.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_REGISTRY_TOKEN_PROD }}

      # The :nfs-prod tag (juicefs variant only, default branch only) matches
      # what HG_SENSOR_IMAGE_NFS in prod-harborguard-workers references. Bake
      # gets :latest on default branch via flavor.latest=true; juicefs is
      # opted out of :latest so the workers' rollback path
      # (HG_SENSOR_IMAGE=:latest in prod-harborguard-sensor) only ever
      # resolves to bake builds.
      - name: Extract metadata for Fly prod image
        if: steps.gate.outputs.skip == 'false' && steps.prod-token-check.outputs.present == 'true'
        id: fly-prod-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.variant.prod_image }}
          flavor: |
            prefix=${{ matrix.variant.tag_prefix }},onlatest=false
            latest=${{ matrix.variant.name == 'bake' && 'auto' || 'false' }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=${{ matrix.variant.tag_prefix }}
            type=raw,value=prod,prefix=${{ matrix.variant.tag_prefix }},enable=${{ matrix.variant.name == 'juicefs' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

      - name: Push manifest list to Fly registry (prod org)
        if: steps.gate.outputs.skip == 'false' && steps.prod-token-check.outputs.present == 'true'
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.fly-prod-meta.outputs.json }}
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}@sha256:%s ' *)

      - name: Inspect Fly prod image
        if: steps.gate.outputs.skip == 'false' && steps.prod-token-check.outputs.present == 'true'
        run: |
          docker buildx imagetools inspect ${{ matrix.variant.prod_image }}:${{ steps.fly-prod-meta.outputs.version }}
